name: Replay-safe webhook fixed-sample inquiry
description: Metadata-only inquiry for one USD 349 nonregulated webhook reliability sample.
title: "[Webhook reliability intake]: "
body:
  - type: markdown
    attributes:
      value: |
        The opening sample is USD 349 for one nonregulated event family, one sanitized or synthetic fixture, one business projection, one staged side-effect intent and one review round. This form is an inquiry, not an order or payment request.
        Keep the title generic. Do not paste, attach or link payloads, schemas, provider or company names, credentials, signatures, secrets, private URLs, customer or personal data, account details, payment data or confidential files.
  - type: dropdown
    id: requested_tier
    attributes:
      label: Requested tier
      description: This public inquiry covers only the fixed opening sample.
      options:
        - fixed_sample_usd_349
    validations:
      required: true
  - type: dropdown
    id: implementation_mode
    attributes:
      label: Implementation mode
      description: Non-Node stacks are limited to an audit and repair plan in the opening sample.
      options:
        - node_typescript_patch_or_audit
        - other_stack_audit_and_repair_plan_only
    validations:
      required: true
  - type: dropdown
    id: event_transport
    attributes:
      label: Sanitized event transport
      description: Select the closest non-sensitive category without naming the provider.
      options:
        - signed_http_webhook
        - shared_secret_http_webhook
        - internal_http_event
        - other_non_sensitive_http_webhook
    validations:
      required: true
  - type: dropdown
    id: primary_need
    attributes:
      label: Primary reliability question
      description: Choose the single most important behavior to review first.
      options:
        - duplicate_and_idempotency_behavior
        - authentication_and_rejection_classification
        - business_projection_consistency
        - unmatched_event_visibility
        - transactional_outbox_boundary
    validations:
      required: true
  - type: dropdown
    id: requested_output
    attributes:
      label: Preferred output
      options:
        - focused_patch_plus_replay_tests
        - audit_map_repair_plan_plus_replay_tests
    validations:
      required: true
  - type: dropdown
    id: target_timing
    attributes:
      label: Target timing
      description: Final timing is confirmed privately after scope review.
      options:
        - within_5_business_days
        - within_10_business_days
        - flexible
    validations:
      required: true
  - type: checkboxes
    id: artifact_confirmations
    attributes:
      label: Artifact and privacy confirmations
      description: Every confirmation is required before a private scope review.
      options:
        - label: I confirm I am authorized to use the future event contract and fixture.
          required: true
        - label: I confirm future fixtures can be synthetic or irreversibly sanitized before private review.
          required: true
        - label: I confirm future inputs contain no credentials, secrets, signatures, account details, customer or personal data, private URLs or confidential notes.
          required: true
        - label: I will not paste, attach or link payloads, schemas, provider names, credentials, customer data or files in this public issue.
          required: true
  - type: checkboxes
    id: scope_confirmations
    attributes:
      label: Scope and commercial confirmations
      description: These boundaries keep the inquiry private-sector, bounded and reviewable.
      options:
        - label: I confirm the buyer, payer, project and intended use are entirely private and have no government, public-institution, state-media, official-association or official-contest relationship.
          required: true
        - label: I confirm the event path is not for health, finance, payments, crypto, security, identity, surveillance or another regulated or high-risk use.
          required: true
        - label: I confirm one event family, one business projection, one staged side-effect intent and one review round.
          required: true
        - label: I do not require production credentials, tenant access, live execution, deployment, a paid connector or an SLA in this sample.
          required: true
        - label: I understand scope, payer, payment protection, acceptance, revisions, cancellation and rights must be confirmed privately before work begins.
          required: true
